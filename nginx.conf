server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Cache static assets
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy the Tesla decryption-key endpoint so the browser makes a
    # same-origin request (avoids CORS). Only file identifiers and ownership
    # metadata pass through here — never video. The upstream request is made
    # server-to-server with Tesla's own Origin/Referer, mirroring the official
    # web viewer.
    #
    # The location is narrowed to the single endpoint the app calls, and the
    # method and Authorization header are enforced, to match the Cloudflare
    # Pages Function in functions/tesla-decrypt/[[path]].ts. Without this it
    # would relay *any* dashcam.tesla.com path while stamping Tesla's own
    # Origin/Referer on it, which is a general-purpose bypass of Tesla's
    # origin checks rather than a decryption-key proxy.
    #
    # NOTE: this means a non-default NEXT_PUBLIC_TESLA_KEY_URL pointing at
    # another relative path needs a matching location block here.
    location /tesla-decrypt/api/1/decrypt/ {
        # POST only, as Tesla's endpoint expects. `if` with `return` is one of
        # the documented-safe uses of `if` in a location block.
        if ($request_method != POST) {
            return 405;
        }
        if ($http_authorization = "") {
            return 401;
        }

        proxy_pass https://dashcam.tesla.com/api/1/decrypt/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host dashcam.tesla.com;
        proxy_set_header Origin https://dashcam.tesla.com;
        proxy_set_header Referer https://dashcam.tesla.com/;
        proxy_set_header Accept-Encoding "";
        # The caller's bearer token is relayed verbatim and deliberately
        # never logged.
        proxy_set_header Authorization $http_authorization;
    }

    # Anything else under this prefix was never a valid request.
    location /tesla-decrypt/ {
        return 404;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}
